<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Flutter Ninja - Portfolio</title>
    <meta name="description" content="Anirudh Singh - Flutter Developer Portfolio">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Anton&family=Bebas+Neue&family=DM+Sans:wght@400;500&family=Ubuntu:wght@400;900&family=Lato:wght@400&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
    <!-- App Bar -->
    <header class="app-bar">
        <div class="app-bar-container">
            <div class="logo">
                <div class="logo-badge">TFN</div>
                <span class="logo-text">The Flutter Ninja</span>
            </div>
            <nav class="nav-links">
                <a href="#" class="nav-link" id="github-link">GitHub</a>
                <a href="#" class="nav-link" id="contact-link">Contact</a>
            </nav>
        </div>
    </header>
    
    <div class="divider"></div>
    
    <!-- Main Content -->
    <main class="main-content">
        <!-- User Card Section -->
        <section class="user-card-section">
            <div class="user-card-container">
                <div class="user-card">
                    <div class="user-avatar">
                        <img id="user-avatar" src="" alt="Profile Picture">
                    </div>
                    <div class="user-info">
                        <h1 id="user-greeting">Hi! My name is Anirudh Singh</h1>
                        <p id="user-bio">Loading...</p>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- Current Status Section -->
        <section class="current-status-section">
            <div class="current-status-container">
                <h2>What I'm Doing Now</h2>
                <div class="status-items">
                    <div class="status-item">
                        <i class="fas fa-home"></i>
                        <span>Living in <strong id="user-city">Loading...</strong></span>
                    </div>
                    <div class="status-item">
                        <i class="fas fa-briefcase"></i>
                        <span>Working for <strong id="user-company">Loading...</strong></span>
                    </div>
                    <div class="status-item">
                        <i class="fas fa-clock"></i>
                        <span>Developing <strong id="user-project">Loading...</strong></span>
                    </div>
                    <div class="status-item">
                        <i class="fas fa-headphones"></i>
                        <span>Get my favourites <a href="#" id="music-link" class="music-link">here</a></span>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- Projects Section -->
        <section class="projects-section">
            <div class="projects-container">
                <div class="projects-header">
                    <h2>My Projects</h2>
                </div>
                <div class="projects-grid" id="projects-grid">
                    <!-- Projects will be loaded here -->
                </div>
            </div>
        </section>
        
        <!-- Tools Section -->
        <section class="tools-section">
            <div class="tools-container">
                <h2>My Tools</h2>
                <div class="tools-grid" id="tools-grid">
                    <!-- Tools will be loaded here -->
                </div>
            </div>
        </section>
        
        <!-- Contact Section -->
        <section class="contact-section">
            <div class="contact-container">
                <h2>Contact Me</h2>
                <div class="contact-links" id="contact-links">
                    <!-- Contact links will be loaded here -->
                </div>
            </div>
        </section>
    </main>
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loader"></div>
    </div>
    
    <!-- Custom JavaScript -->
    <script src="js/firebase-config.js"></script>
    <script src="js/data-service.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
