<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Generate Post</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2rem;
        }

        .input-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 600;
            font-size: 0.95rem;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-bottom: 15px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .button.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .button.cleanup {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
            color: #667eea;
            font-size: 1rem;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #c33;
            display: none;
        }

        .error.active {
            display: block;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #3c3;
            display: none;
        }

        .success.active {
            display: block;
        }

        .results {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .results.active {
            display: block;
        }

        .results h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .image-card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            background: #f9f9f9;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .image-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .image-card img {
            width: 100%;
            border-radius: 6px;
            margin-bottom: 10px;
            background: white;
        }

        .image-card p {
            color: #666;
            font-size: 0.85rem;
            text-align: center;
            word-break: break-all;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-buttons .button {
            flex: 1;
            min-width: 200px;
            margin-bottom: 0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons .button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Generate Post</h1>
        
        <div class="input-section">
            <label for="jsonInput">Paste your JSON here:</label>
            <textarea id="jsonInput" placeholder='{"key": "value", ...}'></textarea>
        </div>

        <button class="button" id="generateBtn" onclick="generatePost()">
            Generate Images
        </button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Generating images...</p>
        </div>

        <div class="error" id="error"></div>
        <div class="success" id="success"></div>

        <div class="results" id="results">
            <h2>Generated Images</h2>
            <div class="images-grid" id="imagesGrid"></div>
            
            <div class="action-buttons">
                <button class="button secondary" id="downloadAllBtn" onclick="downloadAllImages()">
                    📥 Download All Images
                </button>
                <button class="button cleanup" onclick="cleanupServer()">
                    🧹 Cleanup Server
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://infero-labs-landing.onrender.com';
        let generatedImages = [];

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
            setTimeout(() => errorDiv.classList.remove('active'), 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success');
            successDiv.textContent = message;
            successDiv.classList.add('active');
            setTimeout(() => successDiv.classList.remove('active'), 5000);
        }

        async function generatePost() {
            const jsonInput = document.getElementById('jsonInput').value.trim();
            const loading = document.getElementById('loading');
            const generateBtn = document.getElementById('generateBtn');
            const results = document.getElementById('results');

            // Validate JSON
            if (!jsonInput) {
                showError('Please paste your JSON data');
                return;
            }

            let jsonData;
            try {
                jsonData = JSON.parse(jsonInput);
            } catch (e) {
                showError('Invalid JSON format. Please check your input.');
                return;
            }

            // Show loading
            loading.classList.add('active');
            generateBtn.disabled = true;
            results.classList.remove('active');
            document.getElementById('error').classList.remove('active');

            try {
                const response = await fetch(API_BASE+"/generate", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(jsonData)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Failed to generate images');
                }

                if (data.success && data.images) {
                    generatedImages = data.images;
                    displayImages(data.images);
                    showSuccess(data.message || 'Images generated successfully!');
                    results.classList.add('active');
                } else {
                    throw new Error('Unexpected response format');
                }

            } catch (error) {
                showError(`Error: ${error.message}`);
            } finally {
                loading.classList.remove('active');
                generateBtn.disabled = false;
            }
        }

        function displayImages(images) {
            const grid = document.getElementById('imagesGrid');
            grid.innerHTML = '';

            images.forEach(image => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.innerHTML = `
                    <img src="${image.url}" alt="${image.filename}" loading="lazy">
                    <p>${image.filename}</p>
                `;
                grid.appendChild(card);
            });
        }

        async function downloadAllImages() {
            if (generatedImages.length === 0) {
                showError('No images to download');
                return;
            }

            const downloadBtn = document.getElementById('downloadAllBtn');
            downloadBtn.disabled = true;
            downloadBtn.textContent = 'Downloading...';

            try {
                for (const image of generatedImages) {
                    await downloadImage(image.url, image.filename);
                    // Small delay between downloads
                    await new Promise(resolve => setTimeout(resolve, 300));
                }
                showSuccess('All images downloaded successfully!');
            } catch (error) {
                showError(`Download error: ${error.message}`);
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.textContent = '📥 Download All Images';
            }
        }

        async function downloadImage(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            } catch (error) {
                console.error(`Failed to download ${filename}:`, error);
                throw error;
            }
        }

        async function cleanupServer() {
            const cleanupBtn = event.target;
            cleanupBtn.disabled = true;
            cleanupBtn.textContent = 'Cleaning...';

            try {
                const response = await fetch(`${API_BASE}/clean`, {
                    method: 'GET'
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('Server cleaned up successfully!');
                    // Clear the results
                    generatedImages = [];
                    document.getElementById('results').classList.remove('active');
                    document.getElementById('jsonInput').value = '';
                } else {
                    throw new Error(data.message || 'Cleanup failed');
                }

            } catch (error) {
                showError(`Cleanup error: ${error.message}`);
            } finally {
                cleanupBtn.disabled = false;
                cleanupBtn.textContent = '🧹 Cleanup Server';
            }
        }

        // Allow Enter key in textarea (Ctrl+Enter to submit)
        document.getElementById('jsonInput').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                generatePost();
            }
        });
    </script>
</body>
</html>
